[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchcv-backend"
version = "0.1.0"
description = "Local-first FetchCV API, domain model, and agent workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.1",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "httpx==0.28.1",
  "pypdf==6.4.1",
  "reportlab==5.0.0",
  "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pyinstaller>=6.17,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["applyos_api*", "applyos_domain*", "applyos_harness*", "applyos_agent*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
